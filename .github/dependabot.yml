# Abhaengigkeiten automatisch aktualisieren -- moeglichst ohne Nachfrage.
#
# Ziel: Levin soll nichts babysitten. Sicherheits- und Routine-Updates rollen
# vollautomatisch durch (automerge.yml labelt `automerge` und mergt, sobald die
# Checks gruen sind).
#
# Keine Major-Updates: Majors gibt es erst, wenn der Support der genutzten
# Version endet -- das wird separat verfolgt, nicht ueber Dependabot. Jeder
# Eintrag ignoriert darum `version-update:semver-major` fuer alle
# Abhaengigkeiten. Laut GitHub-Doku gilt `ignore` auch fuer Security-Updates:
# ein Sicherheitsfix, den es nur als Major gibt, kommt also NICHT automatisch.
#
# Warum die Gruppen (`groups`)?
#
#   * `minor-and-patch` (applies-to: version-updates): ohne Gruppe oeffnet
#     Dependabot pro Abhaengigkeit einen eigenen PR -- vier Actions-Bumps sind
#     dann vier PRs. Mit `patterns: ["*"]` wird daraus EIN Sammel-PR je
#     Oekosystem, den automerge.yml in einem Rutsch wegmergt.
#   * `security` (applies-to: security-updates): Security-Updates sind eine
#     eigene Welt -- Dependabot mischt sie nie mit Version-Updates in einen PR
#     und braucht darum eine zweite Gruppe. Ohne sie kommt pro Advisory ein
#     eigener PR (genau der Schwall vom 2026-09-08: postcss-selector-parser,
#     fast-uri, nanoid, browserslist einzeln). Mit ihr: ein PR je Oekosystem.
#
# Warum `open-pull-requests-limit` HOCH steht (und nicht niedrig)?
#
#   Das Limit war nie die Volumenbremse -- das sind die Gruppen: mit zwei
#   Gruppen ueber `patterns: ["*"]` oeffnet Dependabot hoechstens zwei PRs je
#   Eintrag (`minor-and-patch`, `security`), egal wie hoch das Limit
#   steht. Ein zu NIEDRIGES Limit dreht die Sache dagegen um und blockiert die
#   Buendelung: ist das Limit ausgeschoepft, legt Dependabot gar keinen neuen
#   PR mehr an -- auch nicht den Sammel-PR, der die Einzel-PRs ersetzen soll.
#   Genau das ist am 2026-09-08 passiert (klasse-christophers: 11 offene
#   npm-PRs bei Limit 10 -> die `majors`-Gruppe wurde nie erzeugt, waehrend
#   Repos mit Luft im Kontingent ihre Gruppe sofort bekamen). 20 ist die Luft,
#   die der Rueckstau braucht; im eingeschwungenen Zustand sind es zwei.
#
# Warum `weekly`?
#
#   Ohne Majors bleibt pro Eintrag nur der Minor-/Patch-Sammel-PR -- der
#   kommt woechentlich. Security-Updates ignorieren `schedule` und kommen
#   weiterhin sofort.
#
# Warum `update-types` in der Gruppe `security`?
#
#   Damit der Security-Sammel-PR keine Majors enthaelt und automatisch
#   durchgehen kann. Ein Sicherheitsfix, den es nur als Major gibt, unterdrueckt
#   das `ignore` der Eintraege -- der muss von Hand nachgezogen werden.
#
# Nur der GITHUB_TOKEN der Repos, kein PAT, keine App, nichts im Cluster.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      time: "04:00"
      timezone: Europe/Berlin
    labels:
      - dependencies
    open-pull-requests-limit: 20
    groups:
      # Ein Sammel-PR fuer alle Minor-/Patch-Version-Updates. Majors sind per
      # `ignore` ausgeschlossen.
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # Ein Sammel-PR fuer alle Sicherheitsupdates dieses Oekosystems statt
      # eines PRs pro Advisory.
      security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Keine Major-Updates: Majors erst, wenn der Support endet (separat verfolgt).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  # EIN npm-Eintrag fuer die Wurzel -- und bewusst KEINE Eintraege je Paket.
  #
  # Das hier ist ein npm-Workspace (`workspaces: ["packages/*"]`) mit genau
  # EINER package-lock.json, naemlich der in der Wurzel. Dependabot behandelt
  # jeden `directory:`-Eintrag als eigenes Projekt: fuer `/packages/frontend`
  # findet es dort keine Lockfile, aendert also nur die package.json -- und
  # dann passen package.json und die Wurzel-Lockfile nicht mehr zusammen:
  #
  #     npm error `npm ci` can only install packages when your package.json
  #     and package-lock.json are in sync.
  #     npm error Missing: astro@7.3.2 from lock file
  #
  # Genau daran sind am 2026-09-10 sechs frische PRs (#164-#170) gescheitert,
  # bevor sie ueberhaupt etwas gebaut hatten. Mit dem Wurzel-Eintrag liest
  # Dependabot die Workspaces aus der Wurzel-package.json, aktualisiert die
  # Abhaengigkeiten aller Pakete und schreibt die eine Lockfile mit.
  #
  # `/e2e` bleibt ein eigener Eintrag: es ist KEIN Workspace (`packages/*`
  # deckt es nicht ab) und haengt nicht an der Wurzel-Lockfile, deshalb kann
  # es dort auch nichts aus dem Tritt bringen.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      time: "04:00"
      timezone: Europe/Berlin
    labels:
      - dependencies
    open-pull-requests-limit: 20
    groups:
      # Ein Sammel-PR fuer alle Minor-/Patch-Version-Updates. Majors sind per
      # `ignore` ausgeschlossen.
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # Ein Sammel-PR fuer alle Sicherheitsupdates dieses Oekosystems statt
      # eines PRs pro Advisory.
      security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Der Astro-Major entfernt `ViewTransitions` aus `astro:transitions`;
      # packages/frontend/src/layouts/Layout.astro nutzt es noch, der Build
      # bricht ab (#174, #177). Erst auf `<ClientRouter />` umstellen, dann
      # diesen Eintrag entfernen.
      - dependency-name: "astro"
        update-types: ["version-update:semver-major"]
      # Keine Major-Updates: Majors erst, wenn der Support endet (separat verfolgt).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
      time: "04:00"
      timezone: Europe/Berlin
    labels:
      - dependencies
    open-pull-requests-limit: 20
    groups:
      # Ein Sammel-PR fuer alle Minor-/Patch-Version-Updates. Majors sind per
      # `ignore` ausgeschlossen.
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # Ein Sammel-PR fuer alle Sicherheitsupdates dieses Oekosystems statt
      # eines PRs pro Advisory.
      security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Keine Major-Updates: Majors erst, wenn der Support endet (separat verfolgt).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /packages/frontend
    schedule:
      interval: weekly
      time: "04:00"
      timezone: Europe/Berlin
    labels:
      - dependencies
    open-pull-requests-limit: 20
    groups:
      # Ein Sammel-PR fuer alle Minor-/Patch-Version-Updates. Majors sind per
      # `ignore` ausgeschlossen.
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # Ein Sammel-PR fuer alle Sicherheitsupdates dieses Oekosystems statt
      # eines PRs pro Advisory.
      security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Das Basis-Image muss der Node-Version folgen, die CI testet und die in
      # `engines` steht -- beides ist 22 (LTS). Node 26 ist heute Current, nicht
      # LTS. Der automatisch gemergte Sprung auf `node:26-alpine` hat den
      # Image-Build am 2026-09-08 zerlegt: better-sqlite3 fand keine Prebuilds
      # fuer Node 26, und der node-gyp-Fallback scheiterte an V8-APIs, die Node
      # 26 entfernt hat. Der PR-Check `test` laeuft auf Node 22 und konnte das
      # nicht sehen -- gemerkt hat es niemand, bis der Deploy still stehenblieb.
      # Wieder anheben, sobald ci.yml und `engines` gemeinsam auf die naechste
      # LTS gehen (dann gehoert dieser Block umgestellt, nicht geloescht).
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      # Keine Major-Updates: Majors erst, wenn der Support endet (separat verfolgt).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /packages/mcp
    schedule:
      interval: weekly
      time: "04:00"
      timezone: Europe/Berlin
    labels:
      - dependencies
    open-pull-requests-limit: 20
    groups:
      # Ein Sammel-PR fuer alle Minor-/Patch-Version-Updates. Majors sind per
      # `ignore` ausgeschlossen.
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # Ein Sammel-PR fuer alle Sicherheitsupdates dieses Oekosystems statt
      # eines PRs pro Advisory.
      security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Das Basis-Image muss der Node-Version folgen, die CI testet und die in
      # `engines` steht -- beides ist 22 (LTS). Node 26 ist heute Current, nicht
      # LTS. Der automatisch gemergte Sprung auf `node:26-alpine` hat den
      # Image-Build am 2026-09-08 zerlegt: better-sqlite3 fand keine Prebuilds
      # fuer Node 26, und der node-gyp-Fallback scheiterte an V8-APIs, die Node
      # 26 entfernt hat. Der PR-Check `test` laeuft auf Node 22 und konnte das
      # nicht sehen -- gemerkt hat es niemand, bis der Deploy still stehenblieb.
      # Wieder anheben, sobald ci.yml und `engines` gemeinsam auf die naechste
      # LTS gehen (dann gehoert dieser Block umgestellt, nicht geloescht).
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      # Keine Major-Updates: Majors erst, wenn der Support endet (separat verfolgt).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
      time: "04:00"
      timezone: Europe/Berlin
    labels:
      - dependencies
    open-pull-requests-limit: 20
    groups:
      # Ein Sammel-PR fuer alle Minor-/Patch-Version-Updates. Majors sind per
      # `ignore` ausgeschlossen.
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
